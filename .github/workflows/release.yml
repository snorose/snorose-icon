name: Release Package

on:
  pull_request:
    branches: [main]
    types: [closed]

# Never cancel a run after it may have published a package.
concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: >-
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    steps:
      - name: Check bot credentials
        run: |
          if [ -z "$BOT_APP_ID" ] || [ -z "$BOT_PRIVATE_KEY" ]; then
            echo "::error::Configure BOT_APP_ID and BOT_PRIVATE_KEY before enabling release automation."
            exit 1
          fi

      - name: Generate bot token
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Check auto-merge configuration
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            if (!repo.allow_auto_merge || !repo.allow_squash_merge) {
              throw new Error('Enable Allow auto-merge and Allow squash merging before enabling release automation.');
            }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2

      - name: Prepare minor version and release notes
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { prepare } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.mjs`);
            await prepare({ github, context, core });

      - run: npm ci
      - run: node --test .github/scripts/release.test.mjs
      - run: npm run ci

      - name: Save version commit and tag
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { persist } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.mjs`);
            await persist();

      - name: Publish npm package
        id: npm-publish
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.mjs`);
            await publish({ github, context, core });

      - name: Create GitHub Release
        uses: actions/github-script@v9
        env:
          NPM_PUBLISHED: ${{ steps.npm-publish.outcome == 'success' }}
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { createRelease } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.mjs`);
            await createRelease({ github, context, core }, {
              npmPublished: process.env.NPM_PUBLISHED === 'true',
            });

      - name: Open dev synchronization PR and enable auto-merge
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const { sync } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release.mjs`);
            await sync({ github, context, core });
